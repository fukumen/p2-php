name: Build and Publish Docker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Publish Base Images"]
    types:
      - completed
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**.md'

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: meta
        run: |
          REPO_HASH=$(git rev-parse --short HEAD)
          echo "REPO_HASH=${REPO_HASH}" >> "$GITHUB_OUTPUT"
          REPO_RAW_LOG=$(TZ=Asia/Tokyo git log -1 --format='%cd %s' --date=format-local:'%Y-%m-%d %H:%M' | head -n 1)
          echo "REPO_LOG=$(echo -n "$REPO_RAW_LOG" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "REPO_LOG_PLAIN=${REPO_RAW_LOG}" >> "$GITHUB_OUTPUT"

      - name: Build local image for version extraction
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker-rep2
          file: deploy/docker-rep2/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rep2:local
          build-contexts: |
            p2-rep2=.

      - name: Extract versions from image
        id: versions
        run: |
          ALPINE_VER=$(docker run --rm rep2:local cat /etc/alpine-release)
          PHP_VER=$(docker run --rm rep2:local php -r 'echo PHP_VERSION;')
          CADDY_VER=$(docker run --rm rep2:local caddy version | awk '{print $1}')
          COMPOSER_VER=$(docker inspect rep2:local --format '{{index .Config.Labels "composer.version"}}')

          echo "alpine=${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "php=${PHP_VER}" >> "$GITHUB_OUTPUT"
          echo "caddy=${CADDY_VER}" >> "$GITHUB_OUTPUT"
          echo "composer=${COMPOSER_VER:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Generate Date Tag
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      # Build rep2 (Standard)
      - name: Build and push rep2
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker-rep2
          file: deploy/docker-rep2/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: |
            p2-rep2=.
          build-args: |
            REPO_HASH=${{ steps.meta.outputs.REPO_HASH }}
            REPO_LOG=${{ steps.meta.outputs.REPO_LOG }}
            RUN_ID=${{ github.run_id }}
            RUN_NUMBER=${{ github.run_number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rep2:latest
            ghcr.io/${{ github.repository_owner }}/rep2:${{ steps.date.outputs.today }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Alpine: ${{ steps.versions.outputs.alpine }} / PHP: ${{ steps.versions.outputs.php }} / Caddy: ${{ steps.versions.outputs.caddy }} / Composer: ${{ steps.versions.outputs.composer }} / rep2: ${{ steps.meta.outputs.REPO_LOG_PLAIN }} (${{ steps.meta.outputs.REPO_HASH }})
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=Alpine: ${{ steps.versions.outputs.alpine }} / PHP: ${{ steps.versions.outputs.php }} / Caddy: ${{ steps.versions.outputs.caddy }} / Composer: ${{ steps.versions.outputs.composer }} / rep2: ${{ steps.meta.outputs.REPO_LOG_PLAIN }} (${{ steps.meta.outputs.REPO_HASH }})
          provenance: false
          outputs: type=registry,oci-mediatypes=true

      # Build rep2-extra (With Extra Packages)
      - name: Build and push rep2-extra
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker-rep2
          file: deploy/docker-rep2/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: |
            p2-rep2=.
          build-args: |
            FLAG_EXTRA=true
            REPO_HASH=${{ steps.meta.outputs.REPO_HASH }}
            REPO_LOG=${{ steps.meta.outputs.REPO_LOG }}
            RUN_ID=${{ github.run_id }}
            RUN_NUMBER=${{ github.run_number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rep2-extra:latest
            ghcr.io/${{ github.repository_owner }}/rep2-extra:${{ steps.date.outputs.today }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Alpine: ${{ steps.versions.outputs.alpine }} / PHP: ${{ steps.versions.outputs.php }} / Caddy: ${{ steps.versions.outputs.caddy }} / Composer: ${{ steps.versions.outputs.composer }} / rep2: ${{ steps.meta.outputs.REPO_LOG_PLAIN }} (${{ steps.meta.outputs.REPO_HASH }})
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=Alpine: ${{ steps.versions.outputs.alpine }} / PHP: ${{ steps.versions.outputs.php }} / Caddy: ${{ steps.versions.outputs.caddy }} / Composer: ${{ steps.versions.outputs.composer }} / rep2: ${{ steps.meta.outputs.REPO_LOG_PLAIN }} (${{ steps.meta.outputs.REPO_HASH }})
          provenance: false
          outputs: type=registry,oci-mediatypes=true
