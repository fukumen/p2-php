name: Build and Publish Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'deploy/**'
      - '**.md'

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download existing repository
        continue-on-error: true
        working-directory: deploy/rep2-allinone
        run: |
          git clone --depth 1 -b gh-pages https://github.com/${{ github.repository }}.git repo
          rm -rf repo/.git

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install APT and RPM Repository Tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils rpm createrepo-c tree zip

      - name: Build Packages
        working-directory: deploy/rep2-allinone
        run: |
          make clean
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=amd64 deb
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=arm64 deb
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=x86_64 rpm
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=arm64 rpm
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=x86_64 macos
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=arm64 macos
          make RUN_ID=${{ github.run_id }} RUN_NUMBER=${{ github.run_number }} ARCH=x86_64 windows

      - name: Create APT and RPM Repository structures
        working-directory: deploy/rep2-allinone
        run: |
          # Import GPG key if available
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --batch --armor --export fukumen@gmail.com > fukumen.gpg.key

            # Setup RPM macros for signing
            echo "%_signature gpg" > ~/.rpmmacros
            echo "%_gpg_name fukumen@gmail.com" >> ~/.rpmmacros
            echo "%__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --no-armor %{?_gpg_digest_algo:--digest-algo %{_gpg_digest_algo}} --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros

            # Sign RPM packages
            rpm --addsign dist/*.rpm || echo "Warning: RPM signing failed or skipped"
          else
            echo "Warning: GPG_PRIVATE_KEY is not set. Packages will be unsigned."
          fi

          # --- APT Repository (.deb) ---
          mkdir -p repo/apt
          cp dist/*.deb repo/apt/
          [ -f fukumen.gpg.key ] && cp fukumen.gpg.key repo/apt/

          # Prune old DEB packages (keep latest 5 per architecture)
          for arch in amd64 arm64; do
            ls -1 repo/apt/rep2-allinone_*_${arch}.deb 2>/dev/null | sort -V | tail -n +6 | xargs -r rm -v -f
          done

          cd repo/apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -9kf Packages
          apt-ftparchive release . > Release

          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            gpg --batch --pinentry-mode loopback --yes -abs -u fukumen@gmail.com -o Release.gpg Release
            gpg --batch --pinentry-mode loopback --yes -abs -u fukumen@gmail.com --clearsign -o InRelease Release
          fi
          cd ../../

          # --- RPM Repository (.rpm) ---
          mkdir -p repo/rpm
          cp dist/*.rpm repo/rpm/ 2>/dev/null || true
          [ -f fukumen.gpg.key ] && cp fukumen.gpg.key repo/rpm/

          # Prune old RPM packages (keep latest 5 per architecture)
          for arch in x86_64 aarch64; do
            ls -1 repo/rpm/rep2-allinone-*.${arch}.rpm 2>/dev/null | sort -V | tail -n +6 | xargs -r rm -v -f
          done

          cd repo/rpm
          createrepo_c .

          # Sign RPM repository metadata
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            gpg --batch --pinentry-mode loopback --yes --detach-sign --armor -u fukumen@gmail.com repodata/repomd.xml
          fi
          cd ../../

          # --- ZIP / Others ---
          mkdir -p repo/zip
          cp dist/*.zip repo/zip/ 2>/dev/null || true
          cp dist/php-checksums.txt repo/php-checksums-${{ github.run_number }}.txt 2>/dev/null || true

          # Prune old checksum files (keep latest 5)
          ls -1 repo/php-checksums-*.txt 2>/dev/null | sort -Vr | tail -n +6 | xargs -r rm -v -f

          # Prune old ZIP packages (keep latest 5 per architecture)
          for arch in x86_64 arm64; do
            ls -1 repo/zip/rep2-allinone-*-windows-${arch}.zip 2>/dev/null | sort -V | tail -n +6 | xargs -r rm -v -f
          done

      - name: Generate HTML Indexes
        working-directory: deploy/rep2-allinone
        run: |
          cd repo
          tree -H '.' -L 2 --noreport --charset utf-8 -T "rep2-allinone Packages" -o index.html
          cd apt && tree -H '.' -L 1 --noreport --charset utf-8 -T "rep2-allinone APT Repository" -o index.html && cd ..
          cd rpm && tree -H '.' -L 1 --noreport --charset utf-8 -T "rep2-allinone RPM Repository" -o index.html && cd ..
          cd zip && tree -H '.' -L 1 --noreport --charset utf-8 -T "rep2-allinone ZIP Downloads" -o index.html && cd ..

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy/rep2-allinone/repo
          keep_files: false
          force_orphan: true
          commit_message: "Deploy repositories (${{ github.event_name == 'push' && github.sha || 'manual' }})"

      - name: Prepare GitHub Releases assets
        working-directory: deploy/rep2-allinone
        run: |
          cp dist/php-checksums.txt dist/php-checksums-${{ github.run_number }}.txt

          COMMIT_DATE=$(cat dist/build_info_rep2_date)
          echo "COMMIT_DATE=${COMMIT_DATE}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases (dated tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$COMMIT_DATE" > /dev/null 2>&1; then
            gh release upload "$COMMIT_DATE" deploy/rep2-allinone/dist/*-macos-*.tar.gz --clobber
          else
            gh release create "$COMMIT_DATE" deploy/rep2-allinone/dist/*-macos-*.tar.gz \
              --title "Build $COMMIT_DATE" \
              --notes "Automated build of commit $(git rev-parse --short HEAD)."
          fi

          # Keep only the 5 most recent dated releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep -E '^[0-9]{12}$' | sort -r | tail -n +6 | \
            while read -r tag; do
              gh release delete "$tag" -y --cleanup-tag
            done

      - name: Publish to GitHub Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the latest release if it does not exist (upload-only; the tag stays)
          gh release view latest > /dev/null 2>&1 || \
            gh release create latest --title "Latest Build" --notes "Automated build triggered by repository updates."

          gh release upload latest \
            deploy/rep2-allinone/dist/*.deb \
            deploy/rep2-allinone/dist/*.rpm \
            deploy/rep2-allinone/dist/*.zip \
            deploy/rep2-allinone/dist/*-macos-*.tar.gz \
            deploy/rep2-allinone/dist/php-checksums-${{ github.run_number }}.txt --clobber

          # Keep only the assets of the current build
          CURRENT="$(cd deploy/rep2-allinone/dist && ls -1 *.deb *.rpm *.zip *-macos-*.tar.gz php-checksums-${{ github.run_number }}.txt)"
          gh release view latest --json assets --jq '.assets[].name' | \
            while read -r asset; do
              echo "$CURRENT" | grep -qx "$asset" || gh release delete-asset latest "$asset" -y
            done

      - name: Checkout Homebrew Tap
        if: github.repository == 'fukumen/p2-php' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: tap-repo

      - name: Generate Homebrew Formula
        if: github.repository == 'fukumen/p2-php' && github.ref == 'refs/heads/main'
        working-directory: deploy/rep2-allinone
        run: |
          mkdir -p ../../tap-output/Formula

          FILE_ARM64=$(basename dist/*-macos-arm64.tar.gz)
          FILE_X86_64=$(basename dist/*-macos-x86_64.tar.gz)
          VERSION=$(basename "$FILE_ARM64" | sed -E 's/^rep2-allinone-([0-9]+)-.*/\1/')

          sed -e "s/@@VERSION@@/$VERSION/g" \
              -e "s/@@FILE_ARM64@@/$FILE_ARM64/g" \
              -e "s/@@FILE_X86_64@@/$FILE_X86_64/g" \
              -e "s/@@SHA_ARM64@@/$(sha256sum "dist/$FILE_ARM64" | awk '{print $1}')/g" \
              -e "s/@@SHA_X86_64@@/$(sha256sum "dist/$FILE_X86_64" | awk '{print $1}')/g" \
              macos/homebrew-formula.rb.template > ../../tap-output/Formula/rep2-allinone.rb

      - name: Push to Homebrew Tap
        if: github.repository == 'fukumen/p2-php' && github.ref == 'refs/heads/main'
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          source-directory: 'tap-output'
          destination-github-username: '${{ github.repository_owner }}'
          destination-repository-name: 'homebrew-tap'
          user-email: 41898282+github-actions[bot]@users.noreply.github.com
          target-branch: main
          commit-message: "chore: update formula for build ${{ github.sha }}"
