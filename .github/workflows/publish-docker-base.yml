name: Build and Publish Docker(Base)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/docker-rep2/docker/Dockerfile.base'

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      today: ${{ steps.date.outputs.today }}
    steps:
      - name: Generate Date Tag
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

  build_base_images:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: base
            flag_extra: "false"
          - suffix: base-extra
            flag_extra: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rep2-${{ matrix.suffix }}
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker-rep2
          file: deploy/docker-rep2/docker/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          outputs: type=registry,oci-mediatypes=true
          build-args: |
            FLAG_EXTRA=${{ matrix.flag_extra }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rep2-${{ matrix.suffix }}:latest
            ghcr.io/${{ github.repository_owner }}/rep2-${{ matrix.suffix }}:${{ needs.prep.outputs.today }}
